<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cairo:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1214;--bg2:#171b1f;--ink:#e8eaec;--mute:#8e9aa3;--ember:#ff7a1a;--glow:#ffa24d;--line:rgba(200,214,226,.15);--serif:"Barlow Condensed","Cairo",sans-serif;--mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]) {}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(rgba(200,214,226,.045) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(200,214,226,.045) 1px,transparent 1px) 0 0/56px 56px,var(--bg);color:var(--ink);font:300 17px/1.8 var(--sans);overflow-x:hidden}
html[lang=ar] .d{font-family:"Cairo",sans-serif;font-weight:700}
.d{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,nav{position:relative;z-index:1}
nav{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:linear-gradient(var(--bg),transparent);z-index:5}
nav b{font-size:20px}
nav a,nav button{color:var(--ink);text-decoration:none;font:400 14px var(--sans);margin-inline-start:22px;background:none;border:0;cursor:pointer}
nav button{border:1px solid var(--ember);padding:5px 16px;border-radius:2px;color:var(--glow)}
nav a:hover{color:var(--glow)}
@media(max-width:700px){nav a{display:none}nav button{margin:0}}
@media(max-width:1024px){section{padding:90px 7vw}.hero{gap:36px}}
@media(max-width:820px){.hero{padding-top:100px;padding-bottom:50px}.hero p.s{margin-inline:auto}.hero .in:nth-child(2){font-size:21px!important}.cta{margin:22px 6px 0}.tl{padding-inline-start:26px}.tl article::before{inset-inline-start:-32px}}
@media(max-width:560px){body{font-size:16px}section{padding:70px 6vw}h2{margin-bottom:30px;gap:14px}.about{font-size:17.5px}.stats b{font-size:44px}.stats div{padding:24px 20px}.tl h3{font-size:21px}.card{padding:24px}.grid{grid-template-columns:1fr}}
@media(hover:none){.card:hover{transform:none;border-color:var(--line)}.cta:hover{transform:none;box-shadow:none}}
section{max-width:1100px;margin:auto;padding:110px 6vw}
.hero{min-height:100svh;display:grid;grid-template-columns:1.2fr .9fr;gap:48px;align-items:center;padding-top:120px}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.hero .frame{order:-1;margin:auto}}
.hero h1{font-size:clamp(46px,8vw,96px);line-height:1.05;font-weight:500}
.hero p.t{color:var(--glow);font-size:19px;margin:18px 0 10px}
.hero p.s{color:var(--mute);max-width:46ch}
.hero .in{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.hero .in:nth-child(2){animation-delay:.25s}.hero .in:nth-child(3){animation-delay:.45s}.hero .in:nth-child(4){animation-delay:.65s}
@keyframes rise{from{opacity:0;transform:translateY(40px);filter:blur(8px)}}
.cta{display:inline-block;margin:30px 8px 0;padding:13px 30px;border-radius:2px;text-decoration:none;font-weight:400;color:#160a02;background:var(--ember);transition:transform .3s,box-shadow .3s}
.cta:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(217,128,63,.4)}
.cta.o{background:none;color:var(--ink);border:1px solid var(--line)}
.frame{position:relative;width:min(340px,78vw);aspect-ratio:3/4;animation:rise 1.6s .3s cubic-bezier(.2,.7,.2,1) both}
.frame::before{content:"";position:absolute;inset:-16px;z-index:3;pointer-events:none;--c:var(--ember);background:linear-gradient(var(--c),var(--c)) 0 0/28px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 28px,linear-gradient(var(--c),var(--c)) 100% 0/28px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 28px,linear-gradient(var(--c),var(--c)) 0 100%/28px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 28px,linear-gradient(var(--c),var(--c)) 100% 100%/28px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 28px;background-repeat:no-repeat}
.frame::after{content:"";position:absolute;inset-inline:0;height:2px;top:0;z-index:3;background:linear-gradient(90deg,transparent,var(--ember),transparent);box-shadow:0 0 18px var(--ember);animation:scan 4.5s ease-in-out infinite}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;z-index:2;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,34px 100%,0 calc(100% - 34px));filter:grayscale(.25) contrast(1.08)}
@keyframes scan{0%,100%{top:2%;opacity:0}15%,85%{opacity:1}50%{top:96%}}
.tag{font:400 13px var(--mono);color:var(--glow);direction:ltr;display:inline-block;margin-bottom:14px;padding:4px 12px;border:1px solid var(--ember);border-radius:2px}
.flow{position:relative;display:flex;margin-top:12px;padding-top:6px}
.flow::before{content:"";position:absolute;top:0;inset-inline:0;height:2px;background:repeating-linear-gradient(90deg,var(--ember) 0 14px,transparent 14px 28px);background-size:28px 2px;animation:belt 1s linear infinite}
html[dir=rtl] .flow::before{animation-name:beltr}
@keyframes belt{to{background-position:28px 0}}@keyframes beltr{to{background-position:-28px 0}}
.node{flex:1;padding:26px 8px;text-align:center;border:1px solid var(--line);margin-inline-end:-1px;background:var(--bg2);font-size:15px;line-height:1.4}
.node small{display:block;font:400 12px var(--mono);color:var(--mute);margin-top:6px;direction:ltr}
.node.hot{border-color:var(--ember);color:var(--glow);animation:pulse 2.4s ease-in-out infinite;position:relative;z-index:1}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,122,26,.4)}}
.cap{color:var(--mute);margin-top:22px;max-width:62ch}
@media(max-width:700px){.flow{flex-direction:column;padding:0;padding-inline-start:6px}.flow::before{inset:0 auto 0 0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--ember) 0 12px,transparent 12px 24px);background-size:2px 24px;animation-name:beltv!important}[dir=rtl] .flow::before{inset:0 0 0 auto}.node{margin:0 0 -1px;padding:16px;margin-inline-start:10px}}
@keyframes beltv{to{background-position:0 24px}}
h2{font-size:clamp(34px,5vw,56px);margin-bottom:44px;display:flex;align-items:center;gap:22px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ember),transparent)}
html[dir=rtl] h2::after{background:linear-gradient(270deg,var(--ember),transparent)}
.rv{opacity:0;transform:translateY(34px);transition:1s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.about{font-size:20px;max-width:62ch;color:#d6ccc0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:56px}
.stats div{background:var(--bg2);padding:34px 26px}
.stats b{display:block;font-size:56px;line-height:1.1;color:var(--glow)}
.stats span{color:var(--mute);font-size:15px}
.tl{position:relative;padding-inline-start:34px;border-inline-start:1px solid var(--line)}
.tl article{position:relative;margin-bottom:46px}
.tl article::before{content:"";position:absolute;inset-inline-start:-40px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 5px rgba(217,128,63,.18),0 0 22px var(--ember)}
.tl small{color:var(--glow);font-size:14px}
.tl h3{font-size:25px;font-weight:500;line-height:1.4;margin:2px 0}
.tl p{color:var(--mute);font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:22px}
.card{padding:30px;border:1px solid var(--line);border-radius:3px;border-inline-start:3px solid var(--ember);background:linear-gradient(160deg,var(--bg2),transparent);transition:border-color .4s,transform .4s}
.card:hover{border-color:var(--ember);transform:translateY(-5px)}
.card h3{font-size:24px;margin-bottom:8px;color:var(--glow);font-weight:500}
.card p,.card li{color:#cfc5b8;font-size:16px}
.card ul{padding-inline-start:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{padding:7px 16px;border:1px solid var(--line);border-radius:2px;font-size:15px}
.contact{text-align:center}
.contact h2{justify-content:center}.contact h2::after{display:none}
.contact .big{font-size:clamp(26px,5vw,52px);color:var(--ink);text-decoration:none;display:block;margin:10px 0;word-break:break-word;direction:ltr}
.contact .big:hover{color:var(--glow)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;text-align:start}
.cgrid .card{display:block;text-decoration:none;color:var(--ink);padding:24px 26px}
.cgrid small{display:block;color:var(--mute);font-size:14px;margin-bottom:4px}
.cgrid b{font:600 clamp(20px,3vw,26px)/1.3 var(--serif);overflow-wrap:anywhere}
html[lang=ar] .cgrid b{font-family:"Cairo",sans-serif;font-weight:700;font-size:clamp(17px,2.6vw,21px)}
.cgrid b.ltr{direction:ltr;display:block;text-align:start;font-family:var(--serif)!important;font-size:clamp(20px,3vw,26px)!important}
.cgrid a.card:hover b{color:var(--glow)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:40px 0 60px;position:relative;z-index:1}
a:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<section id="about"><h2 class="d rv" data-ar="نبذة عني" data-en="About me"></h2>

e.target.querySelectorAll('[data-n]').forEach(n=>{const t=+n.dataset.n;let s=null;const f=ts=>{s=s||ts;const p=Math.min((ts-s)/1800,1);n.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}}),{threshold:.2});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<(innerWidth<700?30:60);i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,d:Math.random()*6});
(function a(t){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(t/1500+p.d)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(240,180,106,'+(.15+.35*Math.abs(Math.sin(t/900+p.d)))+')';x.shadowBlur=10;x.shadowColor='#d9803f';x.fill()});requestAnimationFrame(a)})(0);
</script>
</body>
